name: ozon-to-google-sheets

services:
  app:
    image: "${OZON_IMAGE:-ghcr.io/sotchenkov/ozon_to_google_sheets:latest}"
    pull_policy: always
    env_file:
      - ${OZON_ENV_FILE:-.env}
    init: true
    restart: "no"
    read_only: true
    volumes:
      - type: bind
        source: ./logs
        target: /app/logs
      - type: bind
        source: ./secrets
        target: /app/secrets
        read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
