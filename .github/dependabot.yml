version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Moscow
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: uv
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
      time: "06:15"
      timezone: Europe/Moscow
    open-pull-requests-limit: 2
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
      time: "06:30"
      timezone: Europe/Moscow
    open-pull-requests-limit: 2
    groups:
      container-bases:
        patterns:
          - "*"
