name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

env:
  UV_LOCKED: "1"
  UV_NO_PROGRESS: "1"

jobs:
  release_metadata:
    name: Validate container release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Check out repository and release history
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate stable release metadata
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        id: release
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release tags must use the exact stable SemVer format vX.Y.Z."
            exit 1
          fi

          git fetch origin +refs/heads/main:refs/remotes/origin/main --tags
          release_commit="$(git rev-list -n 1 "refs/tags/$GITHUB_REF_NAME")"
          if ! git merge-base --is-ancestor "$release_commit" origin/main; then
            echo "::error::Release tag $GITHUB_REF_NAME does not point to a commit from main."
            exit 1
          fi

          release_version="${GITHUB_REF_NAME#v}"
          project_version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' pyproject.toml)"
          package_version="$(sed -n 's/^__version__ = "\([^"]*\)"$/\1/p' src/ozon_to_google_sheets/__init__.py)"
          if [[ "$project_version" != "$release_version" || "$package_version" != "$release_version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME must match pyproject.toml and package version."
            exit 1
          fi

          highest_tag="$(
            git tag --merged origin/main --list 'v*' |
              grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' |
              sort -V |
              tail -n 1
          )"
          if [[ "$highest_tag" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::$GITHUB_REF_NAME is not the highest stable SemVer tag on main ($highest_tag)."
            exit 1
          fi

          echo "commit=$release_commit" >> "$GITHUB_OUTPUT"
          echo "version=$release_version" >> "$GITHUB_OUTPUT"

  python:
    name: Python ${{ matrix.python-version }} quality and package
    needs: release_metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.14"
    env:
      PYTHON_VERSION: ${{ matrix.python-version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Check formatting
        run: uv run --locked ruff format --check .

      - name: Lint
        run: uv run --locked ruff check .

      - name: Run tests with coverage
        run: uv run --locked pytest

      - name: Build package
        run: uv build

      - name: Install and inspect wheel in a clean environment
        run: |
          package_environment="$RUNNER_TEMP/package-check"
          uv venv --python "$PYTHON_VERSION" "$package_environment"
          uv pip install --python "$package_environment/bin/python" dist/*.whl
          "$package_environment/bin/python" -c \
            "import importlib.metadata; import ozon_to_google_sheets; print(importlib.metadata.version('ozon-to-google-sheets'))"
          test -x "$package_environment/bin/ozon-to-google-sheets"

  compose:
    name: Docker Compose configuration
    needs: release_metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Docker Compose configuration
        env:
          OZON_ENV_FILE: .env.example
        run: docker compose config --quiet

  container-check:
    name: Container ${{ matrix.architecture }} build and scan
    if: >-
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      github.event_name == 'workflow_dispatch'
    needs:
      - compose
      - python
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            platform: linux/amd64
          - architecture: arm64
            platform: linux/arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        if: matrix.architecture == 'arm64'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image without publishing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          platforms: ${{ matrix.platform }}
          push: false
          tags: ozon-to-google-sheets:ci-${{ github.sha }}-${{ matrix.architecture }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ozon-to-google-sheets:ci-${{ github.sha }}-${{ matrix.architecture }}
          version: v0.73.0
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  publish-platform-images:
    name: Scan and stage ${{ matrix.architecture }} image
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - compose
      - python
      - release_metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            platform: linux/amd64
          - architecture: arm64
            platform: linux/arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release_metadata.outputs.commit }}

      - name: Set up QEMU
        if: matrix.architecture == 'arm64'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image for verification
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          platforms: ${{ matrix.platform }}
          push: false
          tags: ozon-to-google-sheets:ci-${{ needs.release_metadata.outputs.commit }}-${{ matrix.architecture }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ozon-to-google-sheets:ci-${{ needs.release_metadata.outputs.commit }}-${{ matrix.architecture }}
          version: v0.73.0
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare registry image name
        id: image
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
        run: echo "name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Publish verified image
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          LOCAL_IMAGE: ozon-to-google-sheets:ci-${{ needs.release_metadata.outputs.commit }}-${{ matrix.architecture }}
          PLATFORM_TAG: staging-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.architecture }}
        run: |
          docker tag "$LOCAL_IMAGE" "$IMAGE_NAME:$PLATFORM_TAG"
          docker push "$IMAGE_NAME:$PLATFORM_TAG"

  publish-image:
    name: Publish multi-architecture SemVer image
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - publish-platform-images
      - release_metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: ghcr-release-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Confirm release is still the latest stable tag
        run: |
          git fetch origin +refs/heads/main:refs/remotes/origin/main --tags
          highest_tag="$(
            git tag --merged origin/main --list 'v*' |
              grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' |
              sort -V |
              tail -n 1
          )"
          if [[ "$highest_tag" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::A newer stable release tag exists on main: $highest_tag."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: 1.3.3

      - name: Prepare registry image name
        id: image
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
        run: echo "name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Create verified multi-architecture candidate
        id: candidate
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE_NAME:candidate-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            "$IMAGE_NAME:staging-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-amd64" \
            "$IMAGE_NAME:staging-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-arm64"
          docker buildx imagetools inspect \
            "$IMAGE_NAME:candidate-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --raw > "$RUNNER_TEMP/image-manifest.json"
          jq -e '
            [.manifests[].platform | "\(.os)/\(.architecture)"] | sort ==
            ["linux/amd64", "linux/arm64"]
          ' "$RUNNER_TEMP/image-manifest.json"
          candidate_digest="$(
            oras resolve "$IMAGE_NAME:candidate-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          )"
          printf '%s\n' "$candidate_digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
          echo "digest=$candidate_digest" >> "$GITHUB_OUTPUT"

      - name: Publish immutable release aliases and latest
        env:
          CANDIDATE_DIGEST: ${{ steps.candidate.outputs.digest }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          RELEASE_COMMIT: ${{ needs.release_metadata.outputs.commit }}
          RELEASE_VERSION: ${{ needs.release_metadata.outputs.version }}
        run: |
          check_immutable_alias() {
            alias="$1"
            error_file="$RUNNER_TEMP/oras-$alias.err"
            if existing_digest="$(oras resolve "$IMAGE_NAME:$alias" 2> "$error_file")"; then
              if [[ "$existing_digest" != "$CANDIDATE_DIGEST" ]]; then
                echo "::error::Refusing to change immutable tag $alias from $existing_digest to $CANDIDATE_DIGEST."
                exit 1
              fi
            elif ! grep -Eqi '404|manifest unknown|manifest_unknown|name unknown|name_unknown|not found' "$error_file"; then
              cat "$error_file" >&2
              echo "::error::Could not safely verify whether $IMAGE_NAME:$alias already exists."
              exit 1
            fi
          }

          check_immutable_alias "$RELEASE_VERSION"
          check_immutable_alias "sha-$RELEASE_COMMIT"
          oras tag --concurrency 1 \
            "$IMAGE_NAME@$CANDIDATE_DIGEST" \
            "$RELEASE_VERSION" \
            "sha-$RELEASE_COMMIT"

          version_digest="$(oras resolve "$IMAGE_NAME:$RELEASE_VERSION")"
          commit_digest="$(oras resolve "$IMAGE_NAME:sha-$RELEASE_COMMIT")"
          test "$version_digest" = "$CANDIDATE_DIGEST"
          test "$commit_digest" = "$CANDIDATE_DIGEST"

          oras tag "$IMAGE_NAME@$CANDIDATE_DIGEST" latest

      - name: Resolve published image digest
        env:
          CANDIDATE_DIGEST: ${{ steps.candidate.outputs.digest }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          RELEASE_COMMIT: ${{ needs.release_metadata.outputs.commit }}
          RELEASE_VERSION: ${{ needs.release_metadata.outputs.version }}
        run: |
          version_digest="$(oras resolve "$IMAGE_NAME:$RELEASE_VERSION")"
          commit_digest="$(oras resolve "$IMAGE_NAME:sha-$RELEASE_COMMIT")"
          latest_digest="$(oras resolve "$IMAGE_NAME:latest")"
          printf '%s\n' "$version_digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
          test "$version_digest" = "$CANDIDATE_DIGEST"
          test "$commit_digest" = "$CANDIDATE_DIGEST"
          test "$latest_digest" = "$CANDIDATE_DIGEST"
