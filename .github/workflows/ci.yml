name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_LOCKED: "1"
  UV_NO_PROGRESS: "1"

jobs:
  python:
    name: Python ${{ matrix.python-version }} quality and package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.14"
    env:
      PYTHON_VERSION: ${{ matrix.python-version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Check formatting
        run: uv run --locked ruff format --check .

      - name: Lint
        run: uv run --locked ruff check .

      - name: Run tests with coverage
        run: uv run --locked pytest

      - name: Build package
        run: uv build

      - name: Install and inspect wheel in a clean environment
        run: |
          package_environment="$RUNNER_TEMP/package-check"
          uv venv --python "$PYTHON_VERSION" "$package_environment"
          uv pip install --python "$package_environment/bin/python" dist/*.whl
          "$package_environment/bin/python" -c \
            "import importlib.metadata; import ozon_to_google_sheets; print(importlib.metadata.version('ozon-to-google-sheets'))"
          test -x "$package_environment/bin/ozon-to-google-sheets"

  compose:
    name: Docker Compose configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Docker Compose configuration
        env:
          OZON_ENV_FILE: .env.example
        run: docker compose config --quiet

  container-check:
    name: Container ${{ matrix.architecture }} build and scan
    if: >-
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      github.event_name == 'workflow_dispatch'
    needs:
      - compose
      - python
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            platform: linux/amd64
          - architecture: arm64
            platform: linux/arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        if: matrix.architecture == 'arm64'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image without publishing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          platforms: ${{ matrix.platform }}
          push: false
          tags: ozon-to-google-sheets:ci-${{ github.sha }}-${{ matrix.architecture }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ozon-to-google-sheets:ci-${{ github.sha }}-${{ matrix.architecture }}
          version: v0.73.0
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"

  publish-platform-images:
    name: Scan and stage ${{ matrix.architecture }} image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - compose
      - python
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            platform: linux/amd64
          - architecture: arm64
            platform: linux/arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        if: matrix.architecture == 'arm64'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image for verification
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          platforms: ${{ matrix.platform }}
          push: false
          tags: ozon-to-google-sheets:ci-${{ github.sha }}-${{ matrix.architecture }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ozon-to-google-sheets:ci-${{ github.sha }}-${{ matrix.architecture }}
          version: v0.73.0
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare registry image name
        id: image
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
        run: echo "name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Publish verified image
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          LOCAL_IMAGE: ozon-to-google-sheets:ci-${{ github.sha }}-${{ matrix.architecture }}
          PLATFORM_TAG: sha-${{ github.sha }}-${{ matrix.architecture }}
        run: |
          docker tag "$LOCAL_IMAGE" "$IMAGE_NAME:$PLATFORM_TAG"
          docker push "$IMAGE_NAME:$PLATFORM_TAG"

  publish-image:
    name: Publish multi-architecture main image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish-platform-images
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      image_name: ${{ steps.image.outputs.name }}
      image_digest: ${{ steps.published_image.outputs.digest }}

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: 1.3.3

      - name: Prepare registry image name
        id: image
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
        run: echo "name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Publish verified multi-architecture image
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE_NAME:sha-$GITHUB_SHA" \
            --tag "$IMAGE_NAME:latest" \
            "$IMAGE_NAME:sha-$GITHUB_SHA-amd64" \
            "$IMAGE_NAME:sha-$GITHUB_SHA-arm64"
          docker buildx imagetools inspect "$IMAGE_NAME:sha-$GITHUB_SHA" \
            --raw > "$RUNNER_TEMP/image-manifest.json"
          jq -e '
            [.manifests[].platform | "\(.os)/\(.architecture)"] | sort ==
            ["linux/amd64", "linux/arm64"]
          ' "$RUNNER_TEMP/image-manifest.json"

      - name: Resolve published image digest
        id: published_image
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          digest="$(oras resolve "${IMAGE_NAME}:sha-${GITHUB_SHA}")"
          latest_digest="$(oras resolve "${IMAGE_NAME}:latest")"
          printf '%s\n' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
          test "$latest_digest" = "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  update-image-reference:
    name: Update Compose image reference
    needs: publish-image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      pull-requests: write
    env:
      IMAGE_NAME: ${{ needs.publish-image.outputs.image_name }}
      IMAGE_DIGEST: ${{ needs.publish-image.outputs.image_digest }}

    steps:
      - name: Check out develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop

      - name: Pin Compose image to the published digest
        run: |
          image_reference="${IMAGE_NAME}:sha-${GITHUB_SHA}@${IMAGE_DIGEST}"
          if ! grep -Fq "@$IMAGE_DIGEST\"" docker-compose.yml; then
            sed -i "s|^    image: .*|    image: \"$image_reference\"|" docker-compose.yml
          fi
          grep -Fq "    image: \"$IMAGE_NAME" docker-compose.yml
          grep -Fq "@$IMAGE_DIGEST\"" docker-compose.yml
          OZON_ENV_FILE=.env.example docker compose config --quiet

      - name: Create image update pull request
        id: image_pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: automation/update-compose-image
          base: develop
          add-paths: docker-compose.yml
          commit-message: "change: update Compose image digest"
          title: "change: update Compose image digest"
          body: |
            Pin Docker Compose to the image built from `${{ github.sha }}` and its verified GHCR digest.
          delete-branch: true

      - name: Run CI for the image update
        if: steps.image_pr.outputs.pull-request-operation == 'created' || steps.image_pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci.yml --ref automation/update-compose-image
